AllCops:
  TargetRubyVersion: 3.0
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - 'test-results/**/*'
    - 'vendor/**/*'

Layout/LineLength:
  Max: 160

# The action is one large generator class; splitting it up is a separate refactoring.
Metrics:
  Exclude:
    - '**/*.gemspec'
    - 'spec/**/*'
    - 'lib/fastlane/plugin/google_sheet_localize/actions/google_sheet_localize_action.rb'

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false
